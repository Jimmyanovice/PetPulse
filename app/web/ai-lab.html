<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetPulse · 兽医 AI 对话</title><link rel="stylesheet" href="/assets/ai-lab.css"></head>
<body><aside class="sidebar"><a class="brand" href="/">✚ <span>PetPulse<small>宠物健康工作台</small></span></a><h3>我的宠物</h3><div id="pets"></div><a class="subtle" id="knowledge-link" href="/ai-lab?view=knowledge">兽医知识资料 ↗</a><a class="subtle" id="journal-link" href="/">返回健康日志 ↗</a><hr><button class="pet active" id="sandbox">案例检查模式<small>不写入真实宠物日志</small></button><p class="side-note">辅助观察与就医分流<br>不替代兽医诊断</p></aside>
<main><header><div><p class="eyebrow">PET HEALTH · KNOWLEDGE & CARE</p><h1>兽医 AI 对话</h1><p id="context">选择宠物，结合它的日志持续提问。</p></div><a href="/" class="link">返回健康日志 ↗</a></header><div class="status"><span class="dot"></span><span id="dataset">正在读取知识库</span><span class="review" id="review-status"></span></div>
<section id="knowledge-view" class="input-panel" hidden><div class="section-title"><h2>兽医知识资料卡</h2><a id="back-to-chat" class="link" href="/ai-lab">返回 AI 对话 ↗</a></div><p class="hint">资料已由医学组员审核，可按物种和主题查阅原始来源。</p><div class="knowledge-filters"><label>宠物物种<select id="knowledge-species"><option value="cat">猫</option><option value="dog">狗</option><option value="rabbit">兔</option></select></label><label>查找资料<input id="filter" aria-label="搜索资料卡" placeholder="搜索症状、主题或资料内容"></label><span id="card-count"></span></div><div id="cards"></div></section>
<div class="workspace" id="conversation-view"><section class="input-panel pet-context-panel"><div class="section-title"><h2>宠物档案</h2><span>PROFILE</span></div><label>物种<select id="species"><option value="cat">猫</option><option value="dog">狗</option><option value="rabbit">兔</option></select></label><label>档案信息<textarea id="profile" rows="5" maxlength="4000" placeholder="年龄、体重、过敏、既往疾病和当前用药"></textarea></label><div class="section-title"><h2>近期日志</h2><span>近 30 天</span></div><textarea id="logs" aria-label="近期日志" rows="10" maxlength="12000" placeholder="选择宠物后自动读取近期日志；案例模式可每行填写一条观察"></textarea><p class="hint" id="log-info">案例记录不写入真实日志。</p><a class="link" id="context-journal-link" href="/">前往健康日志添加记录 ↗</a></section>
<section class="answer-panel conversation-panel"><div class="section-title"><h2>与兽医 AI 对话</h2><button class="secondary" id="new-chat">新对话</button></div><div id="messages" role="log" aria-label="AI 对话记录" aria-live="polite"></div><form id="question-form"><textarea id="question" rows="3" maxlength="4000" aria-label="向兽医AI提问" placeholder="描述症状或追问刚才的建议，例如：需要关注哪些变化？"></textarea><div class="actions"><span class="hint">回答会结合档案、日志和当前对话</span><button id="ask" type="submit">发送问题 →</button></div></form><p id="progress" role="status"></p></section></div></main><script src="/assets/ai-lab.js"></script></body></html>
