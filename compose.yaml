name: ai-vector-lab

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-vector-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # The explicit volume name is stable across compose project-directory changes.
      - ai_vector_lab_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_vector_lab_postgres_data:
    name: ai_vector_lab_postgres_data
